name: bupt-ucloud-notify
services:
  notify:
    build: .
    image: bupt-ucloud-notify:local
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    user: '10001:10001'
    environment:
      TZ: Asia/Shanghai
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    shm_size: 128m
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./debug:/app/debug
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import json,time; from pathlib import Path; h=json.loads(Path("/app/data/heartbeat.json").read_text()); assert time.time()-h["last_success"] < 600']
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3
